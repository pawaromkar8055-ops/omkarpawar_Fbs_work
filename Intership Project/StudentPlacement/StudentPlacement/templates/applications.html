{% extends 'base.html' %}{% block content %}<h2>My Applications</h2><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Job code</th><th>Company</th><th>Role</th><th>Location</th><th>Status</th><th>Applied</th></tr></thead><tbody>{% for a in applications %}<tr><td>{{a.job_code}}</td><td>{{a.company_name}}</td><td>{{a.role}}</td><td>{{a.location}}</td><td>{{a.status}}</td><td>{{a.applied_at}}</td></tr>{% else %}<tr><td colspan="6">No applications yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
